name: Prepare v0.10.28 test fixture repair
on:
  push:
    branches: [fix/v0.10.28-persist-repair-runner]
    paths: [.github/workflows/prepare-persist-repair.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 004ef16706ee6a39c903eddf2c0bf0a6a63d3681
      - name: Repair fixtures and audit TypeBox constructors
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          fixtures = {
              "crates/ui-egui/tests/fill_sign.rs": (
                  "6874db65007b4c5f55cfdf31bc4bd3f8ad54103c",
                  [(200, "Typed"), (160, "More")],
              ),
              "crates/ui-egui/tests/control.rs": (
                  "e6af166d77bc70c21e99f1eb09c141b790166077",
                  [(200, "Unsaved signature note")],
              ),
          }
          for filename, (expected, cases) in fixtures.items():
              path = Path(filename)
              actual = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
              if actual != expected:
                  raise SystemExit(f"Unexpected {filename} blob: {actual}")
              source = path.read_text(encoding="utf-8")
              for y, text in cases:
                  old = f'TypeBox {{ page: 0, at: [40.0, {y}.0], text: "{text}".into(), size: 10.0, focus: false }}'
                  new = old.replace('focus: false', 'color: [0.0; 3], focus: false')
                  if source.count(old) != 1:
                      raise SystemExit(f"Fixture anchor not unique: {text}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          missing = []
          for filename in subprocess.check_output(["git", "ls-files", "-z", "*.rs"], text=True).split('\0'):
              if not filename:
                  continue
              contents = Path(filename).read_text(encoding="utf-8")
              for match in re.finditer(r'\bTypeBox\s*\{[^{}]*\}', contents):
                  snippet = match.group()
                  line = contents[:match.start()].count('\n') + 1
                  print(f"{filename}:{line}: {snippet}")
                  if 'size:' in snippet and not re.search(r'\bcolor\b', snippet):
                      missing.append(f"{filename}:{line}")
          if missing:
              raise SystemExit(f"TypeBox literals still missing color: {missing}")
          subprocess.run(["git", "grep", "-n", "TypeBox", "--", "*.rs"], check=True)
      - name: Verify diff and publish candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- crates/ui-egui/tests/fill_sign.rs crates/ui-egui/tests/control.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ui-egui/tests/fill_sign.rs crates/ui-egui/tests/control.rs
          git commit -m 'test(fill-sign): initialize colour in saved and unsaved text fixtures'
          git push origin HEAD:refs/heads/fix/v0.10.28-typebox-fixtures
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
