name: Publish v0.10.1 LocalAppData MSI

on:
  push:
    branches:
      - v0.10.1-localappdata-msi

permissions:
  contents: write

concurrency:
  group: localappdata-msi-v0.10.1
  cancel-in-progress: true

jobs:
  build-msi:
    name: Windows ${{ matrix.arch }} MSI and silent install
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: local-msi-${{ matrix.arch }}

      - name: Install WiX Toolset 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          $toolPath = Join-Path $env:USERPROFILE '.dotnet\tools'
          Add-Content -Path $env:GITHUB_PATH -Value $toolPath

      - name: Install NASM for 32-bit native dependencies
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          $nasmDir = 'C:\Program Files\NASM'
          if (-not (Test-Path (Join-Path $nasmDir 'nasm.exe'))) { throw "nasm.exe not found at $nasmDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $nasmDir

      - name: Build per-user MSI
        shell: pwsh
        run: |
          & .\packaging\windows\package.ps1 -Arch ${{ matrix.arch }} -LocalAppDataMsi

      - name: Verify noninteractive install and uninstall
        shell: pwsh
        run: |
          $msi = Get-Item "dist/release/pdfcraft-0.10.1-windows-${{ matrix.arch }}-localappdata.msi"
          & .\packaging\windows\test-local-install.ps1 -Path $msi.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: local-msi-${{ matrix.arch }}
          path: dist/release/pdfcraft-0.10.1-windows-${{ matrix.arch }}-localappdata.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish two MSI assets to Releases
    needs: build-msi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: local-msi-*
          merge-multiple: true
          path: dist/msi

      - name: Require x64 and x86 MSI
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/msi/pdfcraft-0.10.1-windows-x64-localappdata.msi
          test -s dist/msi/pdfcraft-0.10.1-windows-x86-localappdata.msi
          test "$(find dist/msi -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 2

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.10.1-localappdata.1
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Windows x64 and x86 MSI packages based on PdfCraft v0.10.1.

          - Per-user installation path: %LOCALAPPDATA%\pdfcraft
          - Non-roaming app data: %LOCALAPPDATA%\pdfcraft\PdfCraftData
          - No installer wizard and no administrator privileges required for a normal current-user install.
          - Silent install: msiexec /i <downloaded-msi-file> /qn /norestart
          - Silent uninstall: msiexec /x <downloaded-msi-file> /qn /norestart
          - Existing per-machine installations are kept separate. No machine-wide registry changes.
          - These packages are unsigned unless Windows signing is separately configured.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/msi/*.msi --clobber
          else
            gh release create "$RELEASE_TAG" dist/msi/*.msi \
              --target "$GITHUB_SHA" \
              --title 'PdfCraft v0.10.1 - LocalAppData MSI (x64/x86)' \
              --notes-file release-notes.md \
              --prerelease --latest=false
          fi
