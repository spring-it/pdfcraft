name: Publish v0.10.3 沃飞翼览 PDF (Unicode watermark and silent MSI)

on:
  push:
    branches:
      - v0.10.1-localappdata-msi

permissions:
  contents: write

concurrency:
  group: localappdata-msi-v0.10.3
  cancel-in-progress: true

jobs:
  build-msi:
    name: Windows ${{ matrix.arch }} MSI and silent install
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: local-msi-${{ matrix.arch }}

      - name: Install WiX Toolset 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          $toolPath = Join-Path $env:USERPROFILE '.dotnet\tools'
          Add-Content -Path $env:GITHUB_PATH -Value $toolPath

      - name: Install NASM for 32-bit native dependencies
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          $nasmDir = 'C:\Program Files\NASM'
          if (-not (Test-Path (Join-Path $nasmDir 'nasm.exe'))) { throw "nasm.exe not found at $nasmDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $nasmDir

      - name: Test Chinese watermark PNG and layout rules
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui watermark_text::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Chinese watermark rasterization tests failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-edit --lib
          if ($LASTEXITCODE -ne 0) { throw 'PDF watermark engine tests failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui dialogs::watermark_dialog_layout_tests::watermark_dialog_keeps_enough_width_for_settings_and_preview -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Watermark dialog width regression test failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui watermark_dialog_defaults_match_reference -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Watermark dialog defaults test failed' }

      - name: Build per-user MSI
        shell: pwsh
        run: |
          & .\packaging\windows\package.ps1 -Arch ${{ matrix.arch }} -LocalAppDataMsi

      - name: Verify noninteractive install and uninstall
        shell: pwsh
        run: |
          $msi = Get-Item "dist/release/pdfcraft-0.10.3-windows-${{ matrix.arch }}-localappdata.msi"
          & .\packaging\windows\test-local-install.ps1 -Path $msi.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: local-msi-${{ matrix.arch }}
          path: dist/release/pdfcraft-0.10.3-windows-${{ matrix.arch }}-localappdata.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish two MSI assets to Releases
    needs: build-msi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: local-msi-*
          merge-multiple: true
          path: dist/msi

      - name: Require x64 and x86 MSI
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/msi/pdfcraft-0.10.3-windows-x64-localappdata.msi
          test -s dist/msi/pdfcraft-0.10.3-windows-x86-localappdata.msi
          test "$(find dist/msi -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 2

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.10.3-wofei.1
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          沃飞翼览 PDF 0.10.3 企业定制版，基于 PdfCraft 开源项目（MIT OR Apache-2.0）。

          - Per-user installation path: %LOCALAPPDATA%\pdfcraft
          - Non-roaming app data: %LOCALAPPDATA%\pdfcraft\PdfCraftData
          - New red PDF icon supplied for this release: Windows EXE/taskbar, MSI, file associations and shortcuts; Linux/macOS icon resources also updated.
          - Installs a 沃飞翼览 PDF shortcut on the current user's desktop automatically, also with /qn.
          - Removes that desktop shortcut on silent uninstall (without removing user data).
          - Enterprise home screen and Windows title renamed to 沃飞翼览 PDF; removed ArtCraft and Discord promotional controls. The About page lists internal customization developer info: 数字发展室, Bing.Zheng1@aerofugia.com.
          - Enhanced native watermarks: Chinese text via local OS glyph rasterization, transparent PNG, tile/single modes, 9 positions, spacing, color, rotation, opacity, templates, odd/even/custom page ranges. The watermark dialog uses a verified 1160 pt layout with settings on the left and a large live page preview on the right; regression test prevents the inner dialog from resetting the width and hiding all controls. Defaults: 内部资料, 微软雅黑, 15 pt, gray, -45°, 10% opacity, tiled, 80/120 pt gaps, on top, zero offset.
          - Offline processing: no upload of PDFs or OS fonts.
          - No installer wizard and no administrator privileges required for a normal current-user install.
          - Silent install: msiexec /i <downloaded-msi-file> /qn /norestart
          - Silent uninstall: msiexec /x <downloaded-msi-file> /qn /norestart
          - Existing per-machine installations are kept separate. No machine-wide registry changes.
          - These packages are unsigned unless Windows signing is separately configured.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title '沃飞翼览 PDF v0.10.3 - 中文水印增强版 (x64/x86)' --notes-file release-notes.md --prerelease
            gh release upload "$RELEASE_TAG" dist/msi/*.msi --clobber
          else
            gh release create "$RELEASE_TAG" dist/msi/*.msi \
              --target "$GITHUB_SHA" \
              --title '沃飞翼览 PDF v0.10.3 - 中文水印增强版 (x64/x86)' \
              --notes-file release-notes.md \
              --prerelease --latest=false
          fi
