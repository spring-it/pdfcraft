name: Publish v0.10.16 沃飞翼览 PDF (responsive watermark dialog and silent MSI)

on:
  push:
    branches:
      - v0.10.1-localappdata-msi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localappdata-msi-v0.10.16
  cancel-in-progress: true

jobs:
  build-msi:
    name: Windows ${{ matrix.arch }} MSI and silent install
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: local-msi-${{ matrix.arch }}

      - name: Install WiX Toolset 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          $toolPath = Join-Path $env:USERPROFILE '.dotnet\tools'
          Add-Content -Path $env:GITHUB_PATH -Value $toolPath

      - name: Install NASM for 32-bit native dependencies
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Installing NASM (attempt $attempt/3)"
            choco install nasm --yes --no-progress --execution-timeout=1800
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          if (-not $installed) { throw 'NASM installation failed after three attempts' }
          $nasm = Get-Command nasm.exe -ErrorAction SilentlyContinue
          if ($nasm) {
            $nasmDir = Split-Path -Parent $nasm.Source
          } else {
            $candidates = @('C:\Program Files\NASM', 'C:\Program Files (x86)\NASM', (Join-Path $env:ChocolateyInstall 'lib\nasm\tools'))
            $nasmDir = $candidates | Where-Object { Test-Path (Join-Path $_ 'nasm.exe') } | Select-Object -First 1
          }
          if (-not $nasmDir -or -not (Test-Path (Join-Path $nasmDir 'nasm.exe'))) { throw 'NASM installed but nasm.exe could not be located' }
          Add-Content -Path $env:GITHUB_PATH -Value $nasmDir

      - name: Test Chinese CID font fallback, watermark PNG and layout rules
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui branded_window_title_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Window title branding tests failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-render non_embedded_simplified_chinese_cid_fonts_draw_with_windows_system_font -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Non-embedded Chinese CID font fallback test failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui watermark_text::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Chinese watermark rasterization tests failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-edit --lib
          if ($LASTEXITCODE -ne 0) { throw 'PDF watermark engine tests failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui dialogs::watermark_dialog_layout_tests::watermark_dialog_keeps_enough_width_for_settings_and_preview -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Watermark dialog width regression test failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui watermark_dialog_defaults_match_reference -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Watermark dialog defaults test failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui watermark_dialog_preview_scales_to_viewport_without_forcing_modal_height -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Responsive watermark dialog height test failed' }
          cargo test --locked --target ${{ matrix.target }} -p pdfcraft-ui-egui --test dialog_chrome watermark_dialog_stays_content_sized_across_frames -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Watermark dialog geometry regression test failed' }

      - name: Build per-user MSI
        shell: pwsh
        run: |
          & .\packaging\windows\package.ps1 -Arch ${{ matrix.arch }} -LocalAppDataMsi

      - name: Verify noninteractive install and uninstall
        shell: pwsh
        run: |
          $msi = Get-Item "dist/release/pdfcraft-0.10.16-windows-${{ matrix.arch }}-localappdata.msi"
          & .\packaging\windows\test-local-install.ps1 -Path $msi.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: local-msi-${{ matrix.arch }}
          path: dist/release/pdfcraft-0.10.16-windows-${{ matrix.arch }}-localappdata.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ !startsWith(github.event.head_commit.message, 'test(watermark):') }}
    name: Publish two MSI assets to Releases
    needs: build-msi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: local-msi-*
          merge-multiple: true
          path: dist/msi

      - name: Require x64 and x86 MSI
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/msi/pdfcraft-0.10.16-windows-x64-localappdata.msi
          test -s dist/msi/pdfcraft-0.10.16-windows-x86-localappdata.msi
          test "$(find dist/msi -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 2

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.10.16-wofei.1
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          沃飞翼览 PDF 0.10.16 企业定制版，基于 PdfCraft 开源项目（MIT OR Apache-2.0）。

          - Per-user installation path: %LOCALAPPDATA%\pdfcraft
          - Non-roaming app data: %LOCALAPPDATA%\pdfcraft\PdfCraftData
          - ChatGPT-generated red PDF app/document icon supplied by the requester and licensed under MIT OR Apache-2.0; provenance is in LICENSE-source.txt. The Windows MSI includes LICENSE-MIT, LICENSE-APACHE, NOTICE, LICENSE-document.txt, LICENSE-source.txt, LICENSE-lucide.txt, OFL-Inter.txt, OFL-JetBrainsMono.txt and OFL-DancingScript.txt.
          - Installs a 沃飞翼览 PDF shortcut on the current user's desktop automatically, also with /qn.
          - Registers the per-user Windows PDF "Open with" entry as 沃飞翼览 PDF, without changing the current default PDF app; the MSI test verifies FriendlyAppName, ProgID, command and executable version information.
          - Removes that desktop shortcut on silent uninstall (without removing user data).
          - Enterprise home screen and Windows title renamed to 沃飞翼览 PDF; removed ArtCraft and Discord promotional controls. The About page lists internal customization developer info: 数字发展室, Bing.Zheng1@aerofugia.com.
          - Improved display of PDFs with non-embedded Simplified Chinese Adobe-GB1 CID fonts (for example STSong-Light): use a matching CJK font already installed on Windows at runtime. System fonts are not bundled or redistributed.
          - Enhanced native watermarks: Chinese text via local OS glyph rasterization, transparent PNG, tile/single modes, 9 positions, spacing, color, rotation, opacity, templates, odd/even/custom page ranges. Watermark dialog keeps a viewport-safe 670 pt maximum preview canvas. The 600 pt preview column widens very narrow/tall schematic page mockups to a 0.65 minimum aspect ratio so the page uses more of the available horizontal space; saved PDF page geometry is unchanged. The left 640 pt settings column and defaults remain unchanged. Defaults: 内部资料, 微软雅黑, 15 pt, gray, -45°, 10% opacity, tiled, 80/120 pt gaps, on top, zero offset.
          - Offline processing: no upload of PDFs or OS fonts.
          - No installer wizard and no administrator privileges required for a normal current-user install.
          - Silent install: msiexec /i <downloaded-msi-file> /qn /norestart
          - Silent uninstall: msiexec /x <downloaded-msi-file> /qn /norestart
          - Existing per-machine installations are kept separate. No machine-wide registry changes.
          - These packages are unsigned unless Windows signing is separately configured.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title '沃飞翼览 PDF v0.10.16 - 中文水印增强版 (x64/x86)' --notes-file release-notes.md --prerelease
            gh release upload "$RELEASE_TAG" dist/msi/*.msi --clobber
          else
            gh release create "$RELEASE_TAG" dist/msi/*.msi \
              --target "$GITHUB_SHA" \
              --title '沃飞翼览 PDF v0.10.16 - 中文水印增强版 (x64/x86)' \
              --notes-file release-notes.md \
              --prerelease --latest=false
          fi
